name: CI

on:
  push:
    branches:
      - main
      - API
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore/build target Tests.csproj directly rather than GameStore.sln:
      # the .sln also lists clientapp.esproj (a Visual Studio-only SPA proxy
      # project) which always resolves to net472 and fails on Linux runners
      # (missing .NET Framework reference assemblies). Tests.csproj already
      # pulls in API/BLL/DAL/Exceptions via ProjectReference.
      - name: Restore
        run: dotnet restore Tests/Tests.csproj

      - name: Build
        run: dotnet build Tests/Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: Tests/TestResults/test-results.trx

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'clientapp/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: clientapp

      - name: Test
        run: npm test -- --watchAll=false
        working-directory: clientapp

      - name: Build
        run: npm run build
        working-directory: clientapp
        env:
          CI: false
