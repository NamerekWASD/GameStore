# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Deploy is disabled: the Azure subscription is inactive, so azure/login
# and webapps-deploy would fail on every run. Manual trigger only.
# Re-enable by setting the repository variable AZURE_DEPLOY_ENABLED to 'true'.

name: Deploy to Azure (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # или 18 LTS, зависит от react-scripts
          cache: 'npm'
          cache-dependency-path: 'clientapp/package-lock.json'

      - name: Install npm dependencies
        run: npm ci
        working-directory: clientapp

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish API/API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"
        env:
          CI: false

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./deploy-package

      - name: Create deployment package
        run: |
          cd ./deploy-package
          7z a -r ..\app.zip *
          cd ..
        shell: cmd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9D4BFEF616464B009520B16ABBAA5EF9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_456571E9B58443BB97124759B501A4FF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D42599D387A455FA4261AB78D235AC5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'game-store-gg'
          slot-name: 'Production'
          package: ./app.zip